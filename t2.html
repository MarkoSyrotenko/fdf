<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>the</title>
</head>
<body style="background-color: black;">
    <script>
        function factorial(n)
        {
            let fact = 1;
            for (var i = 2; i <= n; i++)
            {
                fact*=i;
            }
            return fact;
        }
        let a = parseInt(prompt("enter a number"));
        alert(factorial(a));
    </script>
</body>
</html>
