<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>the</title>
</head>
<body style="background-color: black;">
    <script>
        function perfect(n)
        {
            let sum=0;
            for (var i = 1; i < n; i++) {
                if (n%i==0) {
                    sum+=i;
                }
            }
            return n==sum;
        }
        let a = parseInt(prompt("enter a number"));
        if (perfect(a)) alert(a+" is perfect");
        else alert(a+" is not perfect");
    </script>
</body>
</html>
