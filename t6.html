<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>the</title>
</head>
<body style="background-color: black;">
    <script>
        function perfect(n)
        {
            let sum=0;
            for (var i = 1; i < n; i++) {
                if (n%i==0) {
                    sum+=i;
                }
            }
            return n==sum;
        }
        function perfrange(a,b)
        {
            for (var i = a; i <= b; i++)
            {
                if (perfect(i)) alert(i);
            }
        }
        let a = parseInt(prompt("enter the min number"));
        let b = parseInt(prompt("enter the max number"));
        perfrange(a,b);
    </script>
</body>
</html>
